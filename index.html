<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;min-height:680px;height:680px;background:#0f0f14;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#fff;border-radius:12px}
.scr{position:absolute;inset:0;display:none;flex-direction:column}.scr.on{display:flex}
.bar{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:#1a1a28;flex-shrink:0;border-bottom:.5px solid rgba(255,255,255,.08)}
.bar-t{font-size:15px;font-weight:500}
.ib{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}.ib:active{transform:scale(.92)}
.btn{height:46px;border-radius:10px;border:none;cursor:pointer;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px}
.bp{background:#4f46e5;color:#fff;flex:1}.bs{background:#252535;color:#ddd;flex:1}.bp:active,.bs:active{opacity:.85}
#home{background:#0f0f14}
.hh{padding:18px 16px 10px;display:flex;align-items:flex-start;justify-content:space-between}
.ht{font-size:22px;font-weight:600;letter-spacing:-.3px}.hsub{font-size:12px;color:#555;margin-top:2px}
.pgrid{flex:1;overflow-y:auto;padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;align-content:start}
.th{aspect-ratio:.707;background:#1e1e2e;border-radius:7px;overflow:hidden;position:relative}
.th img{width:100%;height:100%;object-fit:cover}
.tn{position:absolute;bottom:3px;right:3px;background:rgba(0,0,0,.7);border-radius:3px;padding:2px 4px;font-size:9px}
.td{position:absolute;top:3px;right:3px;width:18px;height:18px;background:rgba(200,40,40,.85);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.eico{font-size:48px}.etx{font-size:15px;font-weight:500;color:#555}.ehint{font-size:12px;text-align:center;padding:0 40px;color:#3a3a4a}
.fab{position:absolute;bottom:88px;right:14px;width:54px;height:54px;border-radius:50%;background:#4f46e5;border:none;color:#fff;font-size:26px;cursor:pointer;box-shadow:0 4px 16px rgba(79,70,229,.5);display:flex;align-items:center;justify-content:center;z-index:10}.fab:active{transform:scale(.93)}
.hfoot{height:72px;background:#1a1a28;padding:12px 14px;display:flex;gap:8px;flex-shrink:0;border-top:.5px solid rgba(255,255,255,.08)}
#cam{background:#000}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#camOvl{position:absolute;inset:0;pointer-events:none}
.camUI{position:absolute;inset:0;display:flex;flex-direction:column}
.ctop{padding:12px 14px;background:linear-gradient(to bottom,rgba(0,0,0,.6),transparent);display:flex;justify-content:space-between;align-items:center}
.chip{font-size:12px;color:rgba(255,255,255,.9);background:rgba(0,0,0,.45);padding:4px 10px;border-radius:20px}
.cbot{margin-top:auto;padding:22px;background:linear-gradient(to top,rgba(0,0,0,.6),transparent);display:flex;justify-content:center}
.shut{width:66px;height:66px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.35);cursor:pointer}.shut:active{transform:scale(.9)}
.camHint{font-size:11px;color:rgba(255,255,255,.8);text-align:center;padding:6px 24px;margin-bottom:-4px}
#det{background:#0a0a12}
.dw{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#dc{display:block;touch-action:none}
.dHB{text-align:center;padding:7px;font-size:12px;color:#666;background:#1a1a28;flex-shrink:0}
.df{padding:11px 14px;background:#1a1a28;display:flex;gap:8px;flex-shrink:0;border-top:.5px solid rgba(255,255,255,.08)}
#fil{background:#0a0a12}
.fp{flex:1;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
#fc{display:block}
.fo{display:flex;gap:8px;padding:10px 14px;background:#1a1a28;overflow-x:auto;flex-shrink:0}.fo::-webkit-scrollbar{display:none}
.fopt{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.fopt canvas{border-radius:6px;border:2px solid #2a2a3a}.fopt.sel canvas{border-color:#4f46e5}
.flbl{font-size:10px;color:#666}.fopt.sel .flbl{color:#4f46e5;font-weight:500}
.ff{padding:11px 14px;background:#1a1a28;display:flex;gap:8px;flex-shrink:0}
.movl{position:absolute;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;z-index:50}.movl.on{display:flex}
.mc{width:100%;background:#1e1e2e;border-radius:16px 16px 0 0;padding:20px}
.mh{font-size:16px;font-weight:500;margin-bottom:12px}
.mi{width:100%;background:#252535;border:none;border-radius:9px;padding:12px;color:#fff;font-size:15px;margin-bottom:12px;outline:none}.mi:focus{outline:1.5px solid #4f46e5}
.ma{display:flex;gap:8px}
.spw{position:absolute;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:60;flex-direction:column;gap:12px}.spw.on{display:flex}
.sp{width:40px;height:40px;border:3.5px solid rgba(255,255,255,.15);border-top-color:#4f46e5;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.slbl{font-size:13px;color:#888}
.toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:#2a2a3a;color:#ddd;padding:8px 16px;border-radius:24px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:70;white-space:nowrap}.toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">

<div id="home" class="scr on">
  <div class="hh">
    <div><div class="ht">📄 DocScan</div><div class="hsub" id="hsub">Sin páginas</div></div>
    <button class="ib" id="hSaveBtn" onclick="openModal()" style="display:none">💾</button>
  </div>
  <div id="pgrid" class="pgrid" style="display:none"></div>
  <div id="emp" class="empty">
    <div class="eico">📷</div><div class="etx">Sin páginas aún</div>
    <div class="ehint">Toca + para fotografiar tu primer documento</div>
  </div>
  <button class="fab" onclick="goCamera()">+</button>
  <div id="hfoot" class="hfoot" style="display:none">
    <button class="btn bs" onclick="clearAll()">🗑 Limpiar</button>
    <button class="btn bp" onclick="openModal()">💾 Guardar PDF</button>
  </div>
</div>

<div id="cam" class="scr">
  <video id="vid" autoplay playsinline muted></video>
  <canvas id="camOvl"></canvas>
  <div class="camUI">
    <div class="ctop">
      <button class="ib" onclick="stopCam(true)">✕</button>
      <div class="chip" id="pgChip">Página 1</div>
      <div style="width:38px"></div>
    </div>
    <div style="flex:1"></div>
    <div class="camHint" id="camHint">Centra el documento en la pantalla</div>
    <div class="cbot"><button class="shut" onclick="capture()"></button></div>
  </div>
</div>

<div id="det" class="scr">
  <div class="bar">
    <button class="ib" onclick="backDet()">←</button>
    <span class="bar-t">Ajustar bordes</span>
    <button class="ib" onclick="resetCorn()">↺</button>
  </div>
  <div class="dw" id="dw"><canvas id="dc"></canvas></div>
  <div class="dHB">Arrastra las esquinas si es necesario</div>
  <div class="df">
    <button class="btn bs" onclick="backDet()">↩ Retomar</button>
    <button class="btn bp" onclick="confirmCrop()">Recortar ✓</button>
  </div>
</div>

<div id="fil" class="scr">
  <div class="bar">
    <button class="ib" onclick="backFil()">←</button>
    <span class="bar-t">Filtro</span>
    <div style="width:38px"></div>
  </div>
  <div class="fp"><canvas id="fc"></canvas></div>
  <div class="fo" id="fo"></div>
  <div class="ff">
    <button class="btn bs" onclick="backFil()">← Atrás</button>
    <button class="btn bp" onclick="addPage()">Agregar página ✓</button>
  </div>
</div>

<div class="movl" id="modal">
  <div class="mc">
    <div class="mh">💾 Guardar como PDF</div>
    <input type="text" class="mi" id="pdfName" placeholder="Nombre del documento">
    <div class="ma">
      <button class="btn bs" onclick="closeModal()">Cancelar</button>
      <button class="btn bp" onclick="genPDF()">Guardar y compartir 🚀</button>
    </div>
  </div>
</div>
<div class="spw" id="sp"><div class="sp"></div><div class="slbl" id="splbl">Procesando…</div></div>
<div class="toast" id="toast"></div>
</div>

<script>
const S={pages:[],stream:null,cap:null,corners:null,cropped:null,scale:1,filter:'original',drag:-1};
const FILTERS=[{id:'original',lbl:'Original'},{id:'bw',lbl:'B/N'},{id:'enhanced',lbl:'Mejorado'},{id:'gray',lbl:'Gris'}];

// ── Detection buffers (allocated once, reused) ───────
const SW=192, DT=130; // canvas width, ms between detections
let rafId=null, lastDet=0;
let liveC=null, targetC=null, detGood=false;
let tmpC=null, tmpSH=0;
let ovlW=0, ovlH=0;
// Pixel buffers — reallocated only when canvas size changes
let _pbw=0,_pbh=0,_gray=null,_blr=null,_bin=null,_ero=null,_vis=null,_que=null;

// ── Utils ─────────────────────────────────────────────
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');}
function toast(msg,dur=2200){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),dur);}
function spin(on,lbl='Procesando…'){$('sp').classList.toggle('on',on);$('splbl').textContent=lbl;}
function loadImg(src){return new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=src;});}
function scaleDown(c,max=1500){const{width:w,height:h}=c;if(w<=max&&h<=max)return c;const s=max/Math.max(w,h);const d=document.createElement('canvas');d.width=Math.round(w*s);d.height=Math.round(h*s);d.getContext('2d').drawImage(c,0,0,d.width,d.height);return d;}

// ── Home ──────────────────────────────────────────────
function updateHome(){
  const n=S.pages.length;
  $('hsub').textContent=n===0?'Sin páginas':`${n} página${n>1?'s':''}`;
  $('emp').style.display=n===0?'flex':'none';
  $('pgrid').style.display=n===0?'none':'grid';
  $('hfoot').style.display=n===0?'none':'flex';
  $('hSaveBtn').style.display=n===0?'none':'flex';
  $('pgChip').textContent=`Página ${n+1}`;
  const g=$('pgrid');g.innerHTML='';
  S.pages.forEach((pg,i)=>{const d=document.createElement('div');d.className='th';d.innerHTML=`<img src="${pg.dataUrl}"><div class="tn">${i+1}</div><div class="td" onclick="delPg(${i})">✕</div>`;g.appendChild(d);});
}
function delPg(i){S.pages.splice(i,1);updateHome();}
function clearAll(){if(!S.pages.length)return;S.pages=[];updateHome();toast('Páginas eliminadas');}

// ── Camera ────────────────────────────────────────────
async function goCamera(){
  show('cam');liveC=null;targetC=null;detGood=false;ovlW=0;ovlH=0;
  $('camHint').textContent='Centra el documento en la pantalla';
  try{
    S.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}},audio:false});
    const vid=$('vid');vid.srcObject=S.stream;
    vid.onloadedmetadata=()=>{
      if(!tmpC)tmpC=document.createElement('canvas');
      tmpC.width=SW;
      tmpSH=Math.round(vid.videoHeight*SW/vid.videoWidth);
      tmpC.height=tmpSH;
      startRaf(vid);
    };
  }catch(e){
    show('home');
    const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.capture='environment';
    inp.onchange=async ev=>{
      const f=ev.target.files[0];if(!f)return;
      const url=URL.createObjectURL(f);const img=await loadImg(url);
      const c=document.createElement('canvas');c.width=img.width;c.height=img.height;c.getContext('2d').drawImage(img,0,0);
      URL.revokeObjectURL(url);processCapture(c,null);
    };
    inp.click();
  }
}

function startRaf(vid){
  stopRaf();
  const ovl=$('camOvl');
  const ctx=ovl.getContext('2d');
  const tick=()=>{
    rafId=requestAnimationFrame(tick);
    const now=performance.now();

    // ── Detection every DT ms ──
    if(now-lastDet>=DT&&vid.videoWidth){
      lastDet=now;
      tmpC.getContext('2d').drawImage(vid,0,0,SW,tmpSH);
      const r=detectDoc(tmpC);
      detGood=r.valid;
      targetC=r.corners;
      $('camHint').textContent=detGood?'Documento detectado — toca para capturar':'Centra el documento en la pantalla';
    }

    // ── Smooth lerp every frame ──
    if(targetC){
      liveC=liveC
        ?liveC.map((c,i)=>[c[0]*.72+targetC[i][0]*.28,c[1]*.72+targetC[i][1]*.28])
        :targetC.map(c=>[...c]);
    }
    if(!liveC)return;

    // ── Draw overlay ──
    if(!ovlW){ovlW=ovl.offsetWidth||380;ovlH=ovl.offsetHeight||560;ovl.width=ovlW;ovl.height=ovlH;}
    // object-fit: cover compensation — match video's visible region exactly
    const vidW=vid.videoWidth,vidH=vid.videoHeight;
    const sCov=Math.max(ovlW/vidW,ovlH/vidH);
    const dispW=vidW*sCov,dispH=vidH*sCov;
    const offX=(ovlW-dispW)/2,offY=(ovlH-dispH)/2;
    const scX=dispW/SW,scY=dispH/tmpSH;
    const pts=liveC.map(([x,y])=>[x*scX+offX,y*scY+offY]);
    ctx.clearRect(0,0,ovlW,ovlH);
    const col=detGood?'rgba(40,210,80,.95)':'rgba(130,130,255,.75)';
    ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.fillStyle=detGood?'rgba(40,210,80,.1)':'rgba(130,130,255,.08)';
    ctx.setLineDash(detGood?[]:[8,6]);
    ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);pts.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));ctx.closePath();ctx.fill();ctx.stroke();ctx.setLineDash([]);
    const dotCol=detGood?'#28d250':'#8888ff';
    pts.forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fillStyle=dotCol;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();});
  };
  rafId=requestAnimationFrame(tick);
}
function stopRaf(){if(rafId){cancelAnimationFrame(rafId);rafId=null;}}
function stopCam(goHome=false){stopRaf();if(S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null;}if(goHome)show('home');}
function backDet(){goCamera();}

function capture(){
  stopRaf();
  const vid=$('vid');
  const c=document.createElement('canvas');c.width=vid.videoWidth;c.height=vid.videoHeight;
  c.getContext('2d').drawImage(vid,0,0);
  const pre=liveC?liveC.map(([x,y])=>[x*vid.videoWidth/SW,y*vid.videoHeight/tmpSH]):null;
  stopCam();processCapture(c,pre);
}
function processCapture(canvas,pre){
  S.cap=scaleDown(canvas,2600);
  if(pre){const sx=S.cap.width/canvas.width,sy=S.cap.height/canvas.height;S.corners=pre.map(([x,y])=>[x*sx,y*sy]);}
  else S.corners=null;
  openDet();
}

// ══════════════════════════════════════════════════════
// DETECTION — Largest Connected Bright Region (BFS)
// ══════════════════════════════════════════════════════
function detectDoc(canvas){
  const w=canvas.width,h=canvas.height,n=w*h;
  const raw=canvas.getContext('2d').getImageData(0,0,w,h).data;

  // Allocate persistent buffers once
  if(w!==_pbw||h!==_pbh){
    _gray=new Uint8Array(n);_blr=new Uint8Array(n);
    _bin=new Uint8Array(n);_ero=new Uint8Array(n);_vis=new Uint8Array(n);
    _que=new Int32Array(n);
    _pbw=w;_pbh=h;
  }

  // 1. Grayscale
  for(let i=0;i<n;i++)_gray[i]=(raw[i*4]*77+raw[i*4+1]*150+raw[i*4+2]*29)>>8;

  // 2. 3×3 box blur (noise reduction)
  _blr.set(_gray);
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++)
    _blr[y*w+x]=(_gray[(y-1)*w+x-1]+_gray[(y-1)*w+x]+_gray[(y-1)*w+x+1]+
                 _gray[y*w+x-1]+_gray[y*w+x]+_gray[y*w+x+1]+
                 _gray[(y+1)*w+x-1]+_gray[(y+1)*w+x]+_gray[(y+1)*w+x+1])/9;

  // 3. Otsu threshold → binary
  const t=otsu(_blr,n);
  for(let i=0;i<n;i++)_bin[i]=_blr[i]>t?1:0;

  // 3b. Morphological erosion (3×3) — breaks thin noise bridges & removes specks
  _ero.fill(0);
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
    const i=y*w+x;
    if(_bin[i]&&_bin[i-1]&&_bin[i+1]&&_bin[i-w]&&_bin[i+w])_ero[i]=1;
  }

  // 4. BFS pass 1: find LARGEST connected component in ERODED image
  _vis.fill(0);
  let bestStart=-1,bestSize=0;
  for(let s=0;s<n;s++){
    if(!_ero[s]||_vis[s])continue;
    let qh=0,qt=0,sz=1;
    _que[qt++]=s;_vis[s]=1;
    while(qh<qt){
      const i=_que[qh++],x=i%w,y=(i/w)|0;
      if(x>0&&_ero[i-1]&&!_vis[i-1]){_vis[i-1]=1;_que[qt++]=i-1;sz++;}
      if(x<w-1&&_ero[i+1]&&!_vis[i+1]){_vis[i+1]=1;_que[qt++]=i+1;sz++;}
      if(y>0&&_ero[i-w]&&!_vis[i-w]){_vis[i-w]=1;_que[qt++]=i-w;sz++;}
      if(y<h-1&&_ero[i+w]&&!_vis[i+w]){_vis[i+w]=1;_que[qt++]=i+w;sz++;}
    }
    if(sz>bestSize){bestSize=sz;bestStart=s;}
  }
  if(bestSize<n*.05||bestSize>n*.96)return{corners:def(w,h),valid:false};

  // 5. BFS pass 2: mark ONLY the largest component
  _vis.fill(0);
  {let qh=0,qt=0;
  _que[qt++]=bestStart;_vis[bestStart]=1;
  while(qh<qt){
    const i=_que[qh++],x=i%w,y=(i/w)|0;
    if(x>0&&_ero[i-1]&&!_vis[i-1]){_vis[i-1]=1;_que[qt++]=i-1;}
    if(x<w-1&&_ero[i+1]&&!_vis[i+1]){_vis[i+1]=1;_que[qt++]=i+1;}
    if(y>0&&_ero[i-w]&&!_vis[i-w]){_vis[i-w]=1;_que[qt++]=i-w;}
    if(y<h-1&&_ero[i+w]&&!_vis[i+w]){_vis[i+w]=1;_que[qt++]=i+w;}
  }}

  // 5b. Conditional dilation — restore paper edges within original binary mask
  // (does NOT recover bridges to noise since those were eliminated in erosion)
  for(let pass=0;pass<2;pass++){
    for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
      const i=y*w+x;
      if(!_vis[i]&&_bin[i]&&(_vis[i-1]===1||_vis[i+1]===1||_vis[i-w]===1||_vis[i+w]===1))_vis[i]=2;
    }
    for(let i=0;i<n;i++)if(_vis[i]===2)_vis[i]=1;
  }

  // 6. Scanlines on LARGEST COMPONENT ONLY → clean edge points
  const lP=[],rP=[],tP=[],bP=[];
  for(let y=0;y<h;y++){
    let l=-1,r=-1;
    for(let x=0;x<w;x++)if(_vis[y*w+x]){l=x;break;}
    for(let x=w-1;x>=0;x--)if(_vis[y*w+x]){r=x;break;}
    if(l>=0&&r-l>w*.08){lP.push([l,y]);rP.push([r,y]);}
  }
  for(let x=0;x<w;x++){
    let tp=-1,bt=-1;
    for(let y=0;y<h;y++)if(_vis[y*w+x]){tp=y;break;}
    for(let y=h-1;y>=0;y--)if(_vis[y*w+x]){bt=y;break;}
    if(tp>=0&&bt-tp>h*.08){tP.push([x,tp]);bP.push([x,bt]);}
  }
  if(lP.length<5||tP.length<5)return{corners:def(w,h),valid:false};

  // 7. Linear regression for each edge
  const lL=regXY(lP),rL=regXY(rP),tL=regYX(tP),bL=regYX(bP);
  const tl=isect(lL,tL),tr=isect(rL,tL),br=isect(rL,bL),blc=isect(lL,bL);
  if(!tl||!tr||!br||!blc)return{corners:def(w,h),valid:false};

  // 8. Validate shape is document-like
  const dW=Math.hypot(tr[0]-tl[0],tr[1]-tl[1]);
  const dH=Math.hypot(blc[0]-tl[0],blc[1]-tl[1]);
  const ar=dW/(dH||1);
  const area=Math.abs((tl[0]*(tr[1]-blc[1])+tr[0]*(br[1]-tl[1])+br[0]*(blc[1]-tr[1])+blc[0]*(tl[1]-br[1]))/2);
  if(ar<0.15||ar>6||area<n*.05)return{corners:def(w,h),valid:false};

  return{corners:[tl,tr,br,blc],valid:true};
}

// x = a·y + b
function regXY(pts){let sy=0,sx=0,syy=0,sxy=0;const n=pts.length;for(const[x,y]of pts){sy+=y;sx+=x;syy+=y*y;sxy+=x*y;}const d=n*syy-sy*sy;if(Math.abs(d)<1e-9)return{a:0,b:sx/n};const a=(n*sxy-sx*sy)/d;return{a,b:(sx-a*sy)/n};}
// y = a·x + b
function regYX(pts){let sx=0,sy=0,sxx=0,sxy=0;const n=pts.length;for(const[x,y]of pts){sx+=x;sy+=y;sxx+=x*x;sxy+=x*y;}const d=n*sxx-sx*sx;if(Math.abs(d)<1e-9)return{a:0,b:sy/n};const a=(n*sxy-sx*sy)/d;return{a,b:(sy-a*sx)/n};}
// Intersect x=a1·y+b1 and y=a2·x+b2
function isect(xy,yx){const d=1-xy.a*yx.a;if(Math.abs(d)<1e-9)return null;const x=(xy.a*yx.b+xy.b)/d;return[x,yx.a*x+yx.b];}
function otsu(g,n){const h=new Int32Array(256);for(let i=0;i<n;i++)h[g[i]]++;let s=0;for(let i=0;i<256;i++)s+=i*h[i];let sb=0,wb=0,mx=0,t=128;for(let i=0;i<256;i++){wb+=h[i];if(!wb)continue;const wf=n-wb;if(!wf)break;sb+=i*h[i];const mb=sb/wb,mf=(s-sb)/wf,v=wb*wf*(mb-mf)**2;if(v>mx){mx=v;t=i;}}return t;}
function def(w,h){const mx=w*.09,my=h*.09;return[[mx,my],[w-mx,my],[w-mx,h-my],[mx,h-my]];}

// ── Detection screen ──────────────────────────────────
function openDet(){
  show('det');
  setTimeout(()=>{
    const wrap=$('dw'),src=S.cap;
    S.scale=Math.min(wrap.clientWidth/src.width,wrap.clientHeight/src.height);
    const canvas=$('dc');
    canvas.width=src.width;canvas.height=src.height;
    canvas.style.width=(src.width*S.scale)+'px';canvas.style.height=(src.height*S.scale)+'px';
    if(!S.corners)S.corners=detectDoc(src).corners;
    drawOvl();setupDrag();
  },80);
}
function drawOvl(){
  const canvas=$('dc'),ctx=canvas.getContext('2d');
  ctx.drawImage(S.cap,0,0);
  const c=S.corners;
  ctx.strokeStyle='#4f46e5';ctx.lineWidth=3/S.scale;ctx.fillStyle='rgba(79,70,229,.15)';
  ctx.beginPath();ctx.moveTo(c[0][0],c[0][1]);for(let i=1;i<4;i++)ctx.lineTo(c[i][0],c[i][1]);ctx.closePath();ctx.fill();ctx.stroke();
  c.forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,10/S.scale,0,Math.PI*2);ctx.fillStyle='#4f46e5';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2/S.scale;ctx.stroke();});
}
function setupDrag(){
  const canvas=$('dc');canvas.style.touchAction='none';
  const pos=e=>{const r=canvas.getBoundingClientRect();return[Math.max(0,Math.min(S.cap.width,(e.clientX-r.left)/S.scale)),Math.max(0,Math.min(S.cap.height,(e.clientY-r.top)/S.scale))];};
  canvas.onpointerdown=e=>{e.preventDefault();const[ix,iy]=pos(e);let best=-1,bd=Infinity;S.corners.forEach(([cx,cy],i)=>{const d=Math.hypot(cx-ix,cy-iy);if(d<bd){bd=d;best=i;}});if(bd<55/S.scale){S.drag=best;canvas.setPointerCapture(e.pointerId);}};
  canvas.onpointermove=e=>{if(S.drag<0)return;const[ix,iy]=pos(e);S.corners[S.drag]=[ix,iy];drawOvl();};
  canvas.onpointerup=()=>{S.drag=-1;};
}
function resetCorn(){S.corners=detectDoc(S.cap).corners;drawOvl();}

// ── Perspective warp ──────────────────────────────────
function orderCorn(pts){const s=[...pts].sort((a,b)=>(a[0]+a[1])-(b[0]+b[1]));const tl=s[0],br=s[3],rem=[s[1],s[2]].sort((a,b)=>(a[0]-a[1])-(b[0]-b[1]));return[tl,rem[1],br,rem[0]];}
function perspWarp(src,pts){
  const[tl,tr,br,bl]=pts;
  const W=Math.round(Math.max(Math.hypot(tr[0]-tl[0],tr[1]-tl[1]),Math.hypot(br[0]-bl[0],br[1]-bl[1])));
  const H=Math.round(Math.max(Math.hypot(bl[0]-tl[0],bl[1]-tl[1]),Math.hypot(br[0]-tr[0],br[1]-tr[1])));
  const dst=document.createElement('canvas');dst.width=W;dst.height=H;
  const Hm=computeH([[0,0],[W,0],[W,H],[0,H]],pts);
  const sp=src.getContext('2d').getImageData(0,0,src.width,src.height).data;
  const dctx=dst.getContext('2d'),di=dctx.createImageData(W,H),D=di.data;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const w2=Hm[6]*x+Hm[7]*y+1;
    const sxF=(Hm[0]*x+Hm[1]*y+Hm[2])/w2;
    const syF=(Hm[3]*x+Hm[4]*y+Hm[5])/w2;
    const x0=Math.floor(sxF),y0=Math.floor(syF);
    if(x0>=0&&x0<src.width-1&&y0>=0&&y0<src.height-1){
      const dxF=sxF-x0,dyF=syF-y0;
      const w00=(1-dxF)*(1-dyF),w10=dxF*(1-dyF),w01=(1-dxF)*dyF,w11=dxF*dyF;
      const i00=(y0*src.width+x0)*4,i10=i00+4,i01=i00+src.width*4,i11=i01+4;
      const di2=(y*W+x)*4;
      D[di2]=sp[i00]*w00+sp[i10]*w10+sp[i01]*w01+sp[i11]*w11;
      D[di2+1]=sp[i00+1]*w00+sp[i10+1]*w10+sp[i01+1]*w01+sp[i11+1]*w11;
      D[di2+2]=sp[i00+2]*w00+sp[i10+2]*w10+sp[i01+2]*w01+sp[i11+2]*w11;
      D[di2+3]=255;
    }
  }
  dctx.putImageData(di,0,0);return dst;
}
function computeH(src,dst){const A=[],b=[];for(let i=0;i<4;i++){const[sx,sy]=src[i],[dx,dy]=dst[i];A.push([sx,sy,1,0,0,0,-dx*sx,-dx*sy]);b.push(dx);A.push([0,0,0,sx,sy,1,-dy*sx,-dy*sy]);b.push(dy);}return gElim(A,b);}
function gElim(A,b){const n=b.length,M=A.map((r,i)=>[...r,b[i]]);for(let c=0;c<n;c++){let mx=Math.abs(M[c][c]),mr=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>mx){mx=Math.abs(M[r][c]);mr=r;}[M[c],M[mr]]=[M[mr],M[c]];for(let r=c+1;r<n;r++){const f=M[r][c]/M[c][c];for(let k=c;k<=n;k++)M[r][k]-=f*M[c][k];}}const x=new Array(n).fill(0);for(let i=n-1;i>=0;i--){x[i]=M[i][n]/M[i][i];for(let j=0;j<i;j++)M[j][n]-=M[j][i]*x[i];}return x;}
async function confirmCrop(){spin(true,'Aplicando recorte…');await new Promise(r=>setTimeout(r,60));S.cropped=perspWarp(S.cap,orderCorn(S.corners));spin(false);S.filter='original';openFil();}

// ── Filters ───────────────────────────────────────────
function applyFil(src,id){const d=document.createElement('canvas');d.width=src.width;d.height=src.height;const ctx=d.getContext('2d');ctx.drawImage(src,0,0);if(id==='original')return d;const img=ctx.getImageData(0,0,d.width,d.height),px=img.data;for(let i=0;i<px.length;i+=4){const gr=.299*px[i]+.587*px[i+1]+.114*px[i+2];let v;if(id==='bw')v=gr>128?255:0;else if(id==='enhanced'){v=Math.max(0,Math.min(255,(gr-80)*1.8));v=v>160?255:v<60?0:v;}else v=gr;px[i]=px[i+1]=px[i+2]=v;}ctx.putImageData(img,0,0);return d;}
function openFil(){show('fil');setTimeout(()=>{renderFP();renderFO();},50);}
function renderFP(){const canvas=$('fc'),f=applyFil(S.cropped,S.filter),wrap=canvas.parentElement,sc=Math.min(wrap.clientWidth/f.width,wrap.clientHeight/f.height);canvas.width=f.width;canvas.height=f.height;canvas.style.width=(f.width*sc)+'px';canvas.style.height=(f.height*sc)+'px';canvas.getContext('2d').drawImage(f,0,0);}
function renderFO(){const c=$('fo');c.innerHTML='';FILTERS.forEach(f=>{const div=document.createElement('div');div.className='fopt'+(f.id===S.filter?' sel':'');div.onclick=()=>{S.filter=f.id;renderFP();renderFO();};const tc=document.createElement('canvas');tc.width=72;tc.height=96;tc.style.cssText='width:52px;height:70px;';if(f.id===S.filter)tc.style.borderColor='#4f46e5';tc.getContext('2d').drawImage(applyFil(S.cropped,f.id),0,0,72,96);const lbl=document.createElement('div');lbl.className='flbl';lbl.textContent=f.lbl;div.appendChild(tc);div.appendChild(lbl);c.appendChild(div);});}
function backFil(){openDet();}
function addPage(){const f=applyFil(S.cropped,S.filter);S.pages.push({dataUrl:f.toDataURL('image/jpeg',.95)});updateHome();show('home');toast('✅ Página agregada');}

// ── PDF ───────────────────────────────────────────────
function openModal(){const d=new Date(),name=`Documento_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;$('pdfName').value=name;$('modal').classList.add('on');setTimeout(()=>$('pdfName').select(),200);}
function closeModal(){$('modal').classList.remove('on');}
async function genPDF(){
  const name=($('pdfName').value.trim()||'Documento').replace(/[<>:"/\\|?*]/g,'_');
  closeModal();spin(true,'Generando PDF…');await new Promise(r=>setTimeout(r,80));
  try{
    const{jsPDF}=window.jspdf;
    const imgs=await Promise.all(S.pages.map(p=>loadImg(p.dataUrl)));
    const pdf=new jsPDF({orientation:imgs[0].width>imgs[0].height?'l':'p',unit:'px',format:[imgs[0].width,imgs[0].height]});
    for(let i=0;i<S.pages.length;i++){if(i>0)pdf.addPage([imgs[i].width,imgs[i].height],imgs[i].width>imgs[i].height?'l':'p');pdf.addImage(S.pages[i].dataUrl,'JPEG',0,0,imgs[i].width,imgs[i].height);}
    const blob=pdf.output('blob'),file=new File([blob],name+'.pdf',{type:'application/pdf'});
    spin(false);
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});}
    else{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name+'.pdf';a.click();URL.revokeObjectURL(url);toast('📥 PDF descargado. Compártelo por WhatsApp.',3500);}
  }catch(e){spin(false);if(e.name!=='AbortError')toast('❌ Error: '+e.message,3000);}
}

updateHome();
</script>
